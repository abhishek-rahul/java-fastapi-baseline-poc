fast-api:
  process-url: "http://127.0.0.1:8000/api/v1/process"
  method: "POST"
  headers:
    Accept: "application/json"

workload:
  thread-pool-size: 4
  request-count: 1000
  delay-ms: 10

http-client:
  connect-timeout-ms: 5000
  read-timeout-ms: 30000
  write-timeout-ms: 10000
  call-timeout-ms: 35000
  max-idle-connections: 5
  keep-alive-duration-ms: 300000

managed-python-runtime:
  python-executable: "python3"
  application-directory: "../python-fastapi"
  uds-directory: "../.managed-python-runtime"
  worker-count: 4
  queue-capacity: 64
  queue-timeout-ms: 5000
  max-frame-bytes: 1048576
  startup-timeout-ms: 10000
  request-timeout-ms: 35000
  shutdown-timeout-ms: 5000
  restart-enabled: true
  restart-initial-backoff-ms: 250
  restart-maximum-backoff-ms: 2000
  restart-max-attempts: 3
  restart-window-ms: 60000
